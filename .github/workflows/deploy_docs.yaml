name: deploy docs

on:
  push:
    branches:
      - main

permissions: read-all

jobs:
  deploy_docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra docs --extra client

      - name: Build docs
        run: uv run sphinx-build -b html docs public
        env:
          NUCLEI_TOKEN: ${{ secrets.NUCLEI_TOKEN }}

      - name: Publish docs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
